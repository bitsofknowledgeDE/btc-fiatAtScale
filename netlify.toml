[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20"

[[redirects]]
from = "https://www.fiatatscale.com/*"
to = "https://fiatatscale.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://www.fiatatscale.com/*"
to = "https://fiatatscale.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://fiatatscale.com/*"
to = "https://fiatatscale.com/:splat"
status = 301
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
